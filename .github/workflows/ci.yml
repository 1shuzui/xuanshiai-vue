name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-and-gate-tests:
    name: Frontend source and synthetic artifact checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate source, parent and MBTI behavior, build and gate failure scenarios
        run: npm run test:source

      - name: Explain validation boundary
        run: echo 'Real HBuilderX production artifact and WeChat device checks run locally; see MP_QUALITY.md.' >> "$GITHUB_STEP_SUMMARY"
